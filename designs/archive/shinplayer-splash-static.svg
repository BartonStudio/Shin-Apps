<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" fill="none">
  <!--
    ShinPlayer 启动画面 · 静态关键帧（设计稿用）
    ------------------------------------------------------------
    这是「流动边框」动画在某个时间点暂停下来的样式：
    · 外框只有「光点段」可见，其余位置无边框
    · 本帧光点停在顶边（x 300→607），模拟动画走了一段后定格
    · 动画参数：光点长度 = 周长 16%（stroke-dasharray .16 .84）
                流动速度 = 30s / 圈（stroke-dashoffset 0 → -1 循环）
    · 颜色：墨色 #0e0e0e / 底色 #f8f8f8
  -->

  <!-- 流动光点段（边框在当前时刻的可见部分，其余无边框） -->
  <path d="M 300 3 L 607 3" stroke="#0e0e0e" stroke-width="1.75" stroke-linecap="round"/>

  <!-- 字标 SHINPLAYER -->
  <text x="390" y="105" text-anchor="middle" dominant-baseline="central"
        font-family="'NB Architekt', 'JetBrains Mono', 'SF Mono', Consolas, monospace"
        font-size="116" font-weight="400" letter-spacing="3.48" fill="#0e0e0e">SHINPLAYER</text>

  <!-- 底部说明 CS2 · REPLAY VIEWER -->
  <text x="390" y="238" text-anchor="middle" dominant-baseline="central"
        font-family="'NB Architekt', 'JetBrains Mono', 'SF Mono', Consolas, monospace"
        font-size="12" font-weight="300" letter-spacing="3.84" fill="#0e0e0e" fill-opacity="0.55">CS2 · REPLAY VIEWER</text>

  <!-- 版本号 -->
  <text x="748" y="250" text-anchor="end" dominant-baseline="central"
        font-family="'NB Architekt', 'JetBrains Mono', 'SF Mono', Consolas, monospace"
        font-size="11" letter-spacing="1.1" fill="#0e0e0e" fill-opacity="0.38">V0.1.0</text>
</svg>
